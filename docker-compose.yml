services:
  mycookbook:
    build:
      context: .
      dockerfile: MyCookbook/Dockerfile
    container_name: mycookbook
    image: localhost/mycookbook:latest
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=MyCookbookDb;Username=postgres;Password=${SA_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      - mycookbook-network
    env_file:
      - .env

  db:
    image: postgres:16
    container_name: mycookbook-db
    environment:
      - POSTGRES_PASSWORD=${SA_PASSWORD}
      - POSTGRES_DB=MyCookbookDb
      - POSTGRES_USER=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mycookbook-network

networks:
  mycookbook-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local