name: Build, Test, and Publish Docker Image

on:
  push:
    branches: [ "main", "beta" ]
  workflow_dispatch:

env:
  DOTNET_PROJECT_PATH: MyCookbook/MyCookbook.csproj
  TEST_PROJECT_PATH: MyCookbook.Test/MyCookbook.Test.csproj
  SOLUTION_PATH: MyCookbook.sln
  DOCKER_IMAGE_NAME_REPO: vingii/mycookbook
  DOTNET_VERSION: '8.0.x'
  PROJECT_DIR: MyCookbook

jobs:
  build_test_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages with cache
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} -c Release --no-build

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from .csproj
        id: get_version
        run: |
          VERSION=$(grep -m 1 '<Version>' "${{ env.DOTNET_PROJECT_PATH }}" | sed -e 's/^.*<Version>//' -e 's/<\/Version>.*$//')
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m 1 '<PackageVersion>' "${{ env.DOTNET_PROJECT_PATH }}" | sed -e 's/^.*<PackageVersion>//' -e 's/<\/PackageVersion>.*$//');
          fi
          if [ -z "$VERSION" ]; then
            echo "Warning: No <Version> or <PackageVersion> found in ${{ env.DOTNET_PROJECT_PATH }}. Using commit SHA as version."
            VERSION="${{ github.sha }}";
          fi
          echo "Detected image version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME_REPO }}:build \
            -f ${{ env.PROJECT_DIR }}/Dockerfile .

      - name: Push production tags
        if: github.ref_name == 'main'
        run: |
          docker tag ${{ env.DOCKER_IMAGE_NAME_REPO }}:build \
            ${{ env.DOCKER_IMAGE_NAME_REPO }}:${{ steps.get_version.outputs.version }}
          docker tag ${{ env.DOCKER_IMAGE_NAME_REPO }}:build \
            ${{ env.DOCKER_IMAGE_NAME_REPO }}:latest
          docker push ${{ env.DOCKER_IMAGE_NAME_REPO }}:${{ steps.get_version.outputs.version }}
          docker push ${{ env.DOCKER_IMAGE_NAME_REPO }}:latest
          echo "Pushed tags: ${{ steps.get_version.outputs.version }}, latest"

      - name: Push beta tag
        if: github.ref_name != 'main'
        run: |
          docker tag ${{ env.DOCKER_IMAGE_NAME_REPO }}:build \
            ${{ env.DOCKER_IMAGE_NAME_REPO }}:beta
          docker push ${{ env.DOCKER_IMAGE_NAME_REPO }}:beta
          echo "Pushed tag: beta"
