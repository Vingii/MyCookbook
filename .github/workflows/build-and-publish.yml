name: Build, Test, and Publish

on:
  push:
    branches: [ "main", "beta" ]
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: vingii/mycookbook
  DOTNET_VERSION: '8.0.x'

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore & Test
        run: |
          dotnet restore MyCookbook.sln
          dotnet test MyCookbook.Test/MyCookbook.Test.csproj -c Release --no-restore

      - name: Extract version
        id: prep
        run: |
          VERSION=$(grep -oP '(?<=<Version>).*?(?=</Version>)' MyCookbook/MyCookbook.csproj || echo "1.0.0")
          TAGS="${{ env.DOCKER_IMAGE_NAME }}:${VERSION},${{ env.DOCKER_IMAGE_NAME }}:latest"
          if [ "${{ github.ref_name }}" != "main" ]; then
            TAGS="${{ env.DOCKER_IMAGE_NAME }}:beta"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MyCookbook/Dockerfile
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=min