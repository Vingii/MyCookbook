name: Build, Test, and Publish

# Pushes to main and pull requests (to any branch) only build and test. A release is published by pushing a
# vX.Y.Z tag that matches <Version> in MyCookbook.csproj (see "Releasing" in CLAUDE.md).
# Pushes to beta publish the :beta image.
on:
  push:
    branches: [ "main", "beta" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: vingii/mycookbook
  DOTNET_VERSION: '8.0.x'

jobs:
  test-and-publish:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright's Chromium does not support yet.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.prep.outputs.version }}
      release: ${{ steps.prep.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: prep
        run: |
          VERSION=$(grep -oP '(?<=<Version>).*?(?=</Version>)' MyCookbook/MyCookbook.csproj)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            if [ "${{ github.ref_name }}" != "v${VERSION}" ]; then
              echo "::error::Tag ${{ github.ref_name }} does not match <Version>${VERSION}</Version> in MyCookbook.csproj"
              exit 1
            fi
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
            echo "tags=${{ env.DOCKER_IMAGE_NAME }}:${VERSION},${{ env.DOCKER_IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "beta" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "tags=${{ env.DOCKER_IMAGE_NAME }}:beta" >> $GITHUB_OUTPUT
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore & Test
        run: |
          dotnet restore MyCookbook.sln
          dotnet test MyCookbook.Test/MyCookbook.Test.csproj -c Release --no-restore

      - name: Frontend Test
        run: |
          cd frontend
          npm ci
          npm test

      - name: Set up E2E Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install E2E deps
        working-directory: e2e
        run: |
          npm ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for E2E
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MyCookbook/Dockerfile
          push: false
          load: true
          tags: localhost/mycookbook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack for E2E
        run: |
          echo "SA_PASSWORD=E2eTestPassword1!" > .env
          echo "ASPNETCORE_ENVIRONMENT=Development" >> .env
          echo "ASPNETCORE_URLS=http://+:8080" >> .env
          echo "WEB_PORT=8080" >> .env
          echo "COOKBOOK_URL=http://localhost:8080" >> .env
          echo "COOKBOOK_AUTHENTIK_URL=" >> .env
          docker compose up -d
          timeout 90 bash -c 'until curl -sf http://localhost:8080/api/auth/me; do sleep 3; done'

      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Login to Docker Hub
        if: steps.prep.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: steps.prep.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MyCookbook/Dockerfile
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # Runs only for a vX.Y.Z tag, after the image has been published.
    needs: test-and-publish
    if: needs.test-and-publish.outputs.release == 'true'
    # Pinned: ubuntu-latest moved to 26.04, which Playwright's Chromium does not support yet.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test-and-publish.outputs.version }}
        run: |
          # Release notes: this version's section of the English changelog.
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found
          ' MyCookbook/CHANGELOG.md > release-notes.md
          gh release create "v$VERSION" --title "$VERSION" --notes-file release-notes.md --verify-tag
